<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink the
         layout viewport instead of only the visual one. Without it, edge-to-edge
         Android (targetSdk 35+, which no longer resizes the window for the IME)
         leaves every `fixed inset-0` overlay at full screen height behind the
         keyboard, so the bottom of a modal sheet cannot be reached. With it,
         svh/dvh units and fixed overlays follow the keyboard down. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#05081A" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="When did you last...? A last-done tracker for the things that matter. No deadlines, no nagging, just information." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="lastGLANCE" />

    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />

    <link rel="manifest" href="%BASE_URL%manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="lastGLANCE" />
    <meta property="og:description" content="When did you last...? A last-done tracker for the things that matter. No deadlines, no nagging, just information." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />

    <meta name="twitter:image" content="%BASE_URL%og-image.png" />

    <title>lastGLANCE</title>
